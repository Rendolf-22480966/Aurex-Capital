services:
  - type: web
    name: aurex-capital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: COINGECKO_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DATA_DIR
        value: /tmp/aurex-data
      - key: NEWS_PROVIDER
        value: rss
      - key: AD_NETWORK
        value: sponsors
      - key: COINGECKO_TIMEOUT_MS
        value: "12000"
      - key: COINGECKO_MAX_RETRIES
        value: "2"
      - key: RATE_LIMIT_MARKET_MAX
        value: "90"
